[project]
name = "crypto-bot"
version = "0.1.0"
description = "Local autonomous Binance Spot trading bot with Telegram control"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:binance.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length isn't a correctness concern here.
# UP042: str+Enum (not StrEnum) is used deliberately and consistently across
# the codebase (DB enum columns, JSON-serializable domain enums); not worth
# a blanket rewrite for a 3.11-only stylistic alias.
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
exclude = ["tests/"]
