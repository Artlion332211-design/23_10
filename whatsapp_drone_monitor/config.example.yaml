# Скопіюй у config.yaml і підстав реальні значення.
# config.yaml НЕ комітиться в git (див. .gitignore).

chats:
  - "Облік БпЛА РР"

# Контакт, куди бот шле алерти й звіти. Спробуй ім'я, як воно збережене в
# контактах телефону, з якого працює бот; якщо пошук у WhatsApp Web його
# не знаходить — заміни на номер у форматі "+380636754187".
admin_chat: "Archi"

# ID таблиці "РР-БпЛА" (з URL: https://docs.google.com/spreadsheets/d/ЦЕЙ_ID/edit).
spreadsheet_id: "1zPdNEJktdkuov_ljo-0HGCp69RloUe4Evx4XVB7nasw"
credentials_path: "./credentials.json"
# У книзі ~13 листів по моделях (DJI Matrice 4T/4E, Mavic 3/3T/3E/4T/4E/
# 3 PRO/Classic, Lucky Strike, Autel, ...) — тому НЕ обмежуємо model_sheets,
# бот сам перевіряє всі листи книги й пропускає ті, де немає колонки
# "Серійний номер". За потреби можна звузити список нижче для швидкості.
model_sheets: null
position_summary_sheet: "На позиції"
# Окремий журнал втрат — живі дані показують, що втрачені борти пишуться
# сюди новим рядком, а не як зміна статусу в листі моделі.
loss_log_sheet: "ВТРАЧЕНО"

# Борт шукаємо за останніми N символами серійника, а не всім рядком —
# якщо ці символи випадково збігаються у двох різних бортів, статус НЕ
# змінюється жодному з них (бот шле алерт "Кілька збігів" замість вгадувати).
serial_suffix_length: 5

# Позиції для денного звіту (мають збігатися з колонкою "Група/Позиція"
# на листі "На позиції" — регістр і "є"/"е" бот нормалізує сам).
daily_report_groups:
  - "Сімсон"
  - "Шмель"
  - "Кобра"
  - "Вій"
daily_report_time: "21:00"

# Усі три значення підтверджені реальними рядками в живій таблиці (не
# здогадка) — але якщо дропдаун у СТАТУС зміниться, онови й тут дослівно.
status_repair: "потрібен ремонт"
status_lost: "втрачено"
status_active: "В роботі"

poll_interval_seconds: 20

chrome_profile_dir: "./chrome_profile"
state_file: "./state.json"
log_file: "./monitor.log"
