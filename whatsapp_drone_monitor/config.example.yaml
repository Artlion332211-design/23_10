# Скопіюй у config.yaml і підстав реальні значення.
# config.yaml НЕ комітиться в git (див. .gitignore).

chats:
  # "точна назва чату у WhatsApp": "позначення групи у звітах/нотатках"
  "Шмель": "Шмель"
  "Сімсон2": "Сімсон2"
  "Кобра 1": "Кобра 1"

# Чат, куди бот шле алерти й звіти — напр. "Ви" (Message yourself).
admin_chat: "Ви"

# ID таблиці "РР-БпЛА" (з URL: https://docs.google.com/spreadsheets/d/ЦЕЙ_ID/edit).
spreadsheet_id: "1zPdNEJktdkuov_ljo-0HGCp69RloUe4Evx4XVB7nasw"
credentials_path: "./credentials.json"
# Обмежити пошук серійника конкретними листами (пришвидшує й дисциплінує).
# Залиш пустим/видали, щоб бот сам перевіряв усі листи книги.
model_sheets:
  - "DJI Matrice 4T"
  - "DJI Matrice 4E"
position_summary_sheet: "На позиції"

# ОБОВ'ЯЗКОВО звір з реальним випадаючим списком у колонці СТАТУС —
# бот пише сюди рядок дослівно, і якщо він не збігається з варіантом
# списку, Google Sheets покаже клітинку як помилку валідації.
status_repair: "потрібен ремонт"
status_lost: "втрачено"

poll_interval_seconds: 20
report_interval_hours: 6

chrome_profile_dir: "./chrome_profile"
state_file: "./state.json"
log_file: "./monitor.log"
